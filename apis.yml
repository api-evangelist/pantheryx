apis:
- name: Relesium Agentic Commerce (UCP / MCP)
  description: 'The Relesium direct-to-consumer storefront (a PanTheryx consumer brand, named on
    pantheryx.com/consumer-brands/) exposes a Universal Commerce Protocol shopping service over MCP.
    An anonymous POST of tools/list to https://relesium.com/api/ucp/mcp returns 13 tools with full
    JSON Schema 2020-12 input schemas: search_catalog, lookup_catalog, get_product, create_cart,
    get_cart, update_cart, cancel_cart, create_checkout, get_checkout, update_checkout,
    complete_checkout, cancel_checkout and get_order. The surface is provided by the Shopify platform
    rather than authored by PanTheryx, but it is live, unauthenticated for discovery, and serves the
    PanTheryx brand catalog.'
  humanURL: https://relesium.com/
  baseURL: https://relesium.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - Ecommerce
  - UCP
