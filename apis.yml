aid: pantheryx
name: PanTheryx
description: 'PanTheryx, Inc. is a Boulder, Colorado nutrition and biotechnology company, founded in 2007,
  that commercializes bovine colostrum-based products for human and animal health. Its proprietary
  ColostrumOne ingredient underpins DiaResQ, a Food for Special Dietary Use for acute infectious
  diarrhea, alongside the consumer brands Relesium, Life''s First Naturals and TruBiotics (acquired from
  Bayer HealthCare). PanTheryx sells physical nutrition products and publishes no developer program,
  OpenAPI, SDK or API reference of any kind; its corporate site is a WordPress marketing and news
  property. It does, however, operate two Shopify-hosted direct-to-consumer storefronts that expose a
  live, anonymous agentic-commerce surface: both relesium.com and lifesfirstnaturals.com serve an
  llms.txt, a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, and a working
  MCP endpoint at /api/ucp/mcp answering tools/list with 13 catalog, cart, checkout and order tools.'
