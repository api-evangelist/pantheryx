- name: Life's First Naturals Agentic Commerce (UCP / MCP)
  description: 'The Life''s First Naturals storefront (a PanTheryx consumer brand; its UCP profile
    resolves to the Shopify shop handle pantheryxlfn.myshopify.com, which confirms PanTheryx
    ownership) exposes the same Universal Commerce Protocol shopping service over MCP. An anonymous
    POST of tools/list to https://www.lifesfirstnaturals.com/api/ucp/mcp returns the same 13 catalog,
    cart, checkout and order tools. Note that the storefront catalog is currently empty:
    /products.json returned zero products at probe time, so the tools are reachable but have nothing
    to sell.'
