attribution_note: This MCP server is generated by the Shopify commerce platform for stores that have UCP
  enabled, not hand-authored by PanTheryx. It is recorded here because it is a live, reachable agent surface
  served from a PanTheryx-controlled host that transacts against the PanTheryx brand catalog — an agent
  can search, cart and check out today. The provider chose to enable it; the schemas are the platform's.
