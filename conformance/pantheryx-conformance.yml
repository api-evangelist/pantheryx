generated: '2026-08-26'
method: probed
source: >-
  Derived from documents fetched live on 2026-08-26: /.well-known/ucp, /.well-known/openid-configuration,
  /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource on relesium.com and
