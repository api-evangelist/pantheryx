standards:
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} to https://relesium.com/api/ucp/mcp returned
    HTTP 200 with a well-formed JSON-RPC 2.0 result containing 13 tools, each with a name, description
    and inputSchema.
- id: json-schema-2020-12
  name: JSON Schema draft 2020-12
  conforms: true
  evidence: >-
    Every tool inputSchema in the tools/list response declares
    "$schema": "https://json-schema.org/draft/2020-12/schema".
- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: >-
    https://relesium.com/.well-known/openid-configuration returns 200 with issuer,
    authorization_endpoint, token_endpoint, jwks_uri, response_types_supported and
    id_token_signing_alg_values_supported (RS256).
- id: oauth2
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence: >-
    https://relesium.com/.well-known/oauth-authorization-server returns 200 with issuer,
    token_endpoint, authorization_endpoint, scopes_supported and
    token_endpoint_auth_methods_supported.
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata (RFC 9728)
  conforms: true
  evidence: >-
    https://relesium.com/.well-known/oauth-protected-resource returns 200 with resource,
    authorization_servers[] and bearer_methods_supported ["header"].
- id: pkce
  name: PKCE (RFC 7636)
  conforms: true
  evidence: code_challenge_methods_supported includes S256 in both authorization-server documents.
- id: rfc9457
  name: RFC 9457 Problem Details
  conforms: false
  evidence: >-
    No HTTP+JSON error surface is published; the MCP transport carries JSON-RPC errors instead. Not
    applicable rather than failed.
- id: openapi
  name: OpenAPI
  conforms: false
  evidence: >-
    No OpenAPI is published on any PanTheryx host. /openapi.json, /swagger.json and /api-docs all
